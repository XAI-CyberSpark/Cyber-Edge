services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.host-lite
    restart: unless-stopped
    volumes:
      - ./data/projects:/app/projects
      - ./data/pipelines:/app/pipelines
      - ./data/state:/app/state

  frontend:
    build:
      context: ../../studio
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
