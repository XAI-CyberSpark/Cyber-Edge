<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAKEgde Studio Desktop</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #0f172a, #020617);
        color: #e2e8f0;
        font-family: Inter, system-ui, sans-serif;
      }

      .shell {
        text-align: center;
      }

      .badge {
        display: inline-flex;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        background: rgba(14, 165, 233, 0.12);
        color: #bae6fd;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="badge">Starting Backend</div>
      <h1>OAKEgde Studio Desktop</h1>
      <p>正在启动本地运行时，请稍候…</p>
    </div>
  </body>
</html>
